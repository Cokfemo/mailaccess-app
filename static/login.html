<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · Mail Access</title>
    <link rel="icon" type="image/png" href="/ma_logo.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
        background: #09090b;
        color: #e4e4e7;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px 16px;
        -webkit-font-smoothing: antialiased;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: #18181b;
        border: 1px solid #27272a;
        border-radius: 8px;
        padding: 32px 24px 28px;
      }
      .brand { text-align: center; margin-bottom: 28px; }
      .brand img { width: 56px; height: 56px; margin-bottom: 14px; }
      .brand h1 {
        font-size: 20px;
        font-weight: 700;
        letter-spacing: 0.08em;
        color: #fafafa;
      }
      .brand .by {
        margin-top: 4px;
        font-size: 11px;
        letter-spacing: 0.15em;
        color: #71717a;
      }
      .brand .tag {
        margin-top: 12px;
        font-size: 10px;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        color: #52525b;
      }
      label {
        display: block;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 0.15em;
        color: #71717a;
        margin: 0 0 6px 2px;
      }
      input {
        width: 100%;
        font: inherit;
        font-size: 16px; /* no auto-zoom on iOS */
        color: #fafafa;
        background: #09090b;
        border: 1px solid #3f3f46;
        border-radius: 4px;
        padding: 12px 14px;
        margin-bottom: 18px;
        outline: none;
      }
      input:focus { border-color: #22d3ee; }
      button {
        width: 100%;
        font: inherit;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #09090b;
        background: #22d3ee;
        border: none;
        border-radius: 4px;
        padding: 13px;
        cursor: pointer;
      }
      button:active { opacity: 0.85; }
      .error {
        display: none;
        margin: 0 0 16px;
        padding: 10px 12px;
        border: 1px solid rgba(248, 113, 113, 0.3);
        border-radius: 4px;
        background: rgba(248, 113, 113, 0.08);
        color: #fca5a5;
        font-size: 12px;
        text-align: center;
      }
      .error.show { display: block; }
      .foot {
        margin-top: 22px;
        text-align: center;
        font-size: 10px;
        letter-spacing: 0.1em;
        color: #3f3f46;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="brand">
        <img src="/ma_logo.png" alt="Mail Access logo" />
        <h1>Mail Access</h1>
        <p class="by">by femo</p>
        <p class="tag">OSINT Email Intelligence Platform</p>
      </div>
      <div class="error" id="error">Wrong username or password. Try again.</div>
      <form method="POST" action="/auth/login" autocomplete="on">
        <label for="username">Username</label>
        <input
          id="username"
          name="username"
          type="text"
          autocomplete="username"
          autocapitalize="none"
          autocorrect="off"
          spellcheck="false"
          required
          autofocus
        />
        <label for="password">Password</label>
        <input
          id="password"
          name="password"
          type="password"
          autocomplete="current-password"
          required
        />
        <button type="submit">Sign in</button>
      </form>
      <p class="foot">Stays signed in for 30 days</p>
    </main>
    <script>
      if (new URLSearchParams(location.search).has("error")) {
        document.getElementById("error").classList.add("show");
      }
    </script>
  </body>
</html>
